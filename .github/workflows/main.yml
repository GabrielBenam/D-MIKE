# Compila D-MIKE para Windows y arma el instalador.
# Se ejecuta solo al subir cambios a la rama main, o a mano desde la pestaña Actions (botón "Run workflow").
name: Compilar D-MIKE para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Revisar que estén todos los archivos
        shell: python
        run: |
          import os, sys
          if not os.path.exists("MANIFIESTO.txt"):
              print("No encuentro MANIFIESTO.txt en la raíz del repositorio.")
              print("Regéneralo (ver CLAUDE.md, entrega) y vuelve a compilar.")
              sys.exit(1)
          # los archivos de .github/ no se revisan aquí
          lista = [l.strip() for l in open("MANIFIESTO.txt", encoding="utf-8") if l.strip() and not l.startswith("#") and not l.strip().startswith(".github/")]
          faltan = [f for f in lista if not os.path.exists(f)]
          if faltan:
              print("Faltan %d archivos:" % len(faltan))
              for f in faltan: print("   - " + f)
              sys.exit(1)
          print("Están los %d archivos del manifiesto." % len(lista))

      - name: Instalar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Pruebas del motor (sin interfaz)
        run: python -m pytest pruebas -q -m "not interfaz" --ignore-glob="*capturas*"

      - name: Leer la versión
        id: version
        shell: python
        run: |
          import os, re
          v = re.search(r'VERSION = "([^"]+)"', open("app/api.py", encoding="utf-8").read())[1]
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"v={v}\n")

      - name: Compilar con PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name D-MIKE
          --icon app/datos/icono.ico
          --add-data "app/ui;app/ui" --add-data "app/datos;app/datos"
          --collect-all webview
          --collect-all pythonnet --collect-all clr_loader
          --hidden-import matplotlib.backends.backend_svg
          --hidden-import matplotlib.backends.backend_agg
          main.py

      - name: Revisar el ejecutable (sin ventana)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\D-MIKE\D-MIKE.exe" -ArgumentList "--prueba" -Wait -PassThru -WorkingDirectory "dist"
          if ($p.ExitCode -ne 0) { Get-Content dist\prueba_error.txt -ErrorAction SilentlyContinue; exit 1 }
          Write-Host "Ejecutable revisado: OK"

      - name: Descargar el instalador de WebView2 de Microsoft
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "instalador\MicrosoftEdgeWebview2Setup.exe"

      - name: Armar el instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") { $env:Path += ";C:\Program Files (x86)\Inno Setup 6" }
            else { choco install innosetup -y --no-progress; $env:Path += ";C:\Program Files (x86)\Inno Setup 6" }
          }
          iscc /DVersion=${{ steps.version.outputs.v }} instalador\d-mike.iss

      - name: Publicar el instalador para descargar
        uses: actions/upload-artifact@v6
        with:
          name: D-MIKE-instalador-${{ steps.version.outputs.v }}
          path: instalador\salida\*.exe
          retention-days: 30
