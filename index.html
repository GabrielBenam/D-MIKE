<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico de proyecto — D-MIKE</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#faf9f5;--surface:#ffffff;--surface2:#f4f2ea;--text:#1f1e1c;--muted:#6a675e;--border:#e4e1d6;
  --accent:#dd5813;--accent-text:#b8460d;--accent-soft:#fcece2;--accent-ink:#ffffff;
  --warn-bg:#fdf3d8;--warn-bd:#e9cf85;--warn-tx:#6b4c00;--info-bg:#eef3f8;--info-bd:#c9d8e6;--info-tx:#23415c;
  --ok:#2f7a4d;--grid:#cfcdc3;--gridhead:#efede5;--cell:#ffffff;
  --shadow:0 1px 2px rgba(31,30,28,.06),0 6px 20px rgba(31,30,28,.05);
  --sans:Montserrat,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --xl:Calibri,Carlito,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1c1a;--surface:#282623;--surface2:#322f2b;--text:#f2f0e8;--muted:#a9a598;--border:#3f3c36;
    --accent:#e8622a;--accent-text:#ff8f57;--accent-soft:#3b2519;
    --warn-bg:#3a3012;--warn-bd:#6b5a1f;--warn-tx:#f0d98a;--info-bg:#1f2b36;--info-bd:#35495c;--info-tx:#b7d1ea;
    --ok:#69c088;--grid:#4a4741;--gridhead:#34312d;--cell:#22201e;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1d1c1a;--surface:#282623;--surface2:#322f2b;--text:#f2f0e8;--muted:#a9a598;--border:#3f3c36;
  --accent:#e8622a;--accent-text:#ff8f57;--accent-soft:#3b2519;
  --warn-bg:#3a3012;--warn-bd:#6b5a1f;--warn-tx:#f0d98a;--info-bg:#1f2b36;--info-bd:#35495c;--info-tx:#b7d1ea;
  --ok:#69c088;--grid:#4a4741;--gridhead:#34312d;--cell:#22201e;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{min-height:100%}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.top-in{max-width:840px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;font-size:14px}
.dot{width:12px;height:12px;border-radius:4px;background:var(--accent);display:inline-block}
.sub{color:var(--muted);font-weight:500;font-size:13px;margin-left:auto}
.bar{height:3px;background:var(--border)}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.wrap{max-width:840px;margin:0 auto;padding:22px 18px 60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:26px;line-height:1.2;margin:0 0 8px;font-weight:700}
h2{font-size:19px;line-height:1.3;margin:0 0 10px;font-weight:700}
h3{font-size:15px;margin:18px 0 8px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-bottom:8px}
.qtitle{font-size:21px;line-height:1.3;font-weight:700;margin:0 0 6px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;font-weight:500;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:11px 22px;font-weight:600;cursor:pointer;font-size:15px}
.btn:hover{filter:brightness(.95)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent-text);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:7px 14px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:500}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:14px 16px;margin:14px 0}
.warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:13.5px}
.info{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info-tx);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:13.5px}
.phase{margin:20px 0 6px;display:flex;align-items:baseline;gap:10px}
.phase b{font-size:16px}
.phase .n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.mod{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--surface)}
.mod-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mod-h b{font-size:14.5px}
.id{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted)}
.badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.badge.N{background:var(--accent);border-color:var(--accent);color:#fff}
.badge.R{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.badge.P{background:var(--surface2);color:var(--muted);font-style:italic}
.badge.w{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-tx)}
.why{color:var(--muted);font-size:13px;margin:4px 0 0}
details{margin:6px 0}
summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent-text)}
details>div{padding:6px 0 0;font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto;max-width:100%;border:1px solid var(--grid);border-radius:8px}
table.xl{border-collapse:collapse;font-family:var(--xl);font-variant-numeric:tabular-nums;font-size:13px;background:var(--cell);min-width:100%}
.xl th,.xl td{border:1px solid var(--grid);padding:3px 10px;white-space:nowrap;height:24px}
.xl thead th{background:var(--gridhead);font-weight:600;text-align:center}
.xl thead tr.l th{font-weight:400;color:var(--muted);font-size:11.5px}
.xl thead tr.r th{font-weight:400;font-style:italic;color:var(--muted);font-size:11.5px}
.xl th.rn{background:var(--gridhead);color:var(--muted);text-align:center;width:34px;min-width:34px;font-weight:400}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;align-items:flex-start}
.sumrow:last-child{border-bottom:0}
.sumrow span:first-child{color:var(--muted);flex:1}
.sumrow span:nth-child(2){flex:1;font-weight:600}
textarea.json{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:180px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.status{min-height:20px;font-size:13px;margin-top:10px;color:var(--ok)}
.status.err{color:var(--accent-text)}
@media (max-width:520px){h1{font-size:22px}.qtitle{font-size:19px}.card{padding:18px}.sub{display:none}}
</style>
<style>
:root{--bg:#faf8f4;--text:#2b2620;--muted:#5f574c;--border:#e2dcd0;--accent:#dd5813;--accent-text:#b3460d;--accent-soft:#fbe8dd;--surface2:#f3efe7}
:root[data-theme="dark"]{--bg:#1c1916;--surface:#25211d;--surface2:#211d19;--text:#f1ece4;--muted:#c9c0b2;--border:#463f37;--accent:#f08a4b;--accent-text:#f08a4b;--accent-soft:#3d2617}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1916;--surface:#25211d;--surface2:#211d19;--text:#f1ece4;--muted:#c9c0b2;--border:#463f37;--accent:#f08a4b;--accent-text:#f08a4b;--accent-soft:#3d2617}}
body{margin:0;background:var(--bg);color:var(--text)}
.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.cab .marca svg{height:36px;width:auto;display:block}.cab .marca .logo-o{display:none}
:root[data-theme="dark"] .cab .marca .logo-c{display:none}:root[data-theme="dark"] .cab .marca .logo-o{display:block}
.cab .tit{font-weight:600;font-size:14px}.cab .esp{flex:1}.cab #estado{font-size:12px;color:var(--muted)}
.interruptor{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
.interruptor input{position:absolute;opacity:0;width:1px;height:1px}.pista{width:40px;height:22px;border-radius:11px;background:var(--border);position:relative}
.pista::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .18s}
.interruptor input:checked+.pista{background:var(--accent)}.interruptor input:checked+.pista::after{left:21px}.interruptor input:focus-visible+.pista{outline:2px solid var(--accent);outline-offset:2px}
.progreso{height:3px;background:var(--border)}.progreso i{display:block;height:3px;background:var(--accent);width:0;transition:width .3s}
.sub{font-size:12px;color:var(--muted)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 60px)}
nav#nav{background:var(--surface2);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav-b{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;font:inherit;font-size:13.5px;color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left}
.nav-b svg{color:var(--accent);flex:none}.nav-b:hover{background:var(--accent-soft)}.nav-b.activo{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.cand{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:0 5px}
main{min-width:0}.wrap{max-width:900px;margin:0 auto;padding:18px 18px 40px}
.chatlog{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0;padding:4px}
.msg{padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5;max-width:88%}.msg.user{align-self:flex-end;background:var(--accent-soft)}.msg.assistant{align-self:flex-start;background:var(--surface2);border:1px solid var(--border)}
.chat textarea{flex:1;min-width:200px;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text)}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12.5px;border-radius:16px;padding:6px 12px;cursor:pointer}.chip:hover{border-color:var(--accent)}
.tabla{overflow-x:auto}.tabla table{border-collapse:collapse;width:100%;font-size:13px}.tabla th{text-align:left;background:var(--surface2);padding:6px 8px}.tabla td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.resumen{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 14px;font-size:14px}.pasos li{margin-bottom:6px}
#otra input,#otra textarea.json{width:100%;box-sizing:border-box}
@media (max-width:800px){.shell{grid-template-columns:1fr}nav#nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:6px}.nav-b{white-space:nowrap;width:auto}}
nav#nav[hidden]{display:none}body:not(.con-sesion) .shell{grid-template-columns:1fr}
.inicio-folio .dos{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:10px 0}.inicio-folio h2{font-size:16px;margin:4px 0}
#folio-in{font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;width:100%;box-sizing:border-box}
@media (max-width:700px){.inicio-folio .dos{grid-template-columns:1fr}}
</style>

<script>function crearMotor(T){
  const CATD={},ORDEN={},FIDX={};
  T.catalogo.forEach((c,i)=>{CATD[c.id]=c;ORDEN[c.id]=i;});
  T.fases.forEach((f,i)=>{FIDX[f]=i;});
  const RANK={O:1,R:2,N:3,P:3};
  const nz=v=>v===undefined?null:v;
  function match(c,a,act){
    for(const k of Object.keys(c)){
      const v=c[k];
      if(k==='no'){ if(match(v,a,act)) return false; }
      else if(k==='activo_alguno'){ if(!act||!v.some(m=>act.has(m))) return false; }
      else{
        const val=nz(a[k]);
        if(v!==null&&typeof v==='object'&&!Array.isArray(v)){
          for(const o of Object.keys(v)){
            const x=v[o];
            if(o==='in'&&!x.includes(val)) return false;
            if(o==='lt'&&!(val!==null&&val<x)) return false;
            if(o==='contiene'&&!(Array.isArray(val)&&val.includes(x))) return false;
          }
        } else if(val!==v) return false;
      }
    }
    return true;
  }
  function diagnosticar(a){
    const S=new Map(); const adv=[],notas=[]; const cols=new Map(); const mins={};
    const fi=(a.fase_actual in FIDX)?FIDX[a.fase_actual]:0;
    const getS=i=>{ if(!S.has(i)) S.set(i,{prio:null,motivos:[],lock:false}); return S.get(i); };
    function activar(i,p,m){
      const s=getS(i);
      if(s.prio==='X'||s.lock){ s.silent=false; return; }
      if(s.prio===null||RANK[p]>RANK[s.prio]) s.prio=p;
      if(m&&!s.motivos.includes(m)) s.motivos.push(m);
    }
    function fijar(i,p,m){
      const s=getS(i);
      if(s.prio===null) s.silent=true;
      s.prio=p; s.lock=true;
      if(m&&!s.motivos.includes(m)) s.motivos.push(m);
    }
    const actSet=()=>{ const r=new Set(); for(const [i,s] of S){ if(['N','R','P'].includes(s.prio)&&CATD[i].fases.some(f=>FIDX[f]>=fi)) r.add(i);} return r; };
    function aplicar(r,deg){
      for(const [i,p0,m] of (r.activar||[])) activar(i,deg?'O':p0,deg?('síntoma secundario: '+m):m);
      if(deg) return;
      for(const [i,p,m] of (r.fijar||[])) fijar(i,p,m);
      for(const x of (r.advertir||[])) if(!adv.includes(x)) adv.push(x);
      if(r.nota&&!notas.includes(r.nota)) notas.push(r.nota);
      for(const c of (r.columnas||[])) if(!cols.has(c.nombre)) cols.set(c.nombre,c);
      Object.assign(mins,r.minimos||{});
    }
    const sec=a.secundarios||[];
    for(const r of T.reglas){
      if(r.etapa===1){
        const s=r.sintoma_base;
        if(a.sintoma===s) aplicar(r,false); else if(sec.includes(s)) aplicar(r,true);
      }
    }
    for(const r of T.reglas){ if(r.etapa===2&&match(r.si,a)) aplicar(r,false); }
    function prereqs(){
      let ch=true;
      while(ch){
        ch=false;
        const lista=[...actSet()].sort((x,y)=>ORDEN[x]-ORDEN[y]);
        for(const i of lista){
          for(const pr of CATD[i].prereq){
            let alts=pr.split('|');
            if(a.tipo_dato==='atributo'&&alts.some(x=>x.startsWith('MSA-'))) alts=alts.slice().reverse();
            const ok=alts.some(x=>{ const s=S.get(x); return s&&(['N','R','P'].includes(s.prio)||(s.prio==='O'&&s.lock)); });
            if(!ok){
              const cand=alts.filter(x=>{ const s=S.get(x); return !(s&&s.prio==='X'); });
              if(cand.length){ const s=getS(cand[0]); s.prio='P'; s.motivos.push('prerrequisito de '+i); ch=true; }
            }
          }
        }
      }
    }
    prereqs();
    for(const r of T.reglas){ if(r.etapa===3&&match(r.si,a,actSet())) aplicar(r,false); }
    prereqs();
    let mods=[]; const sug=[],nor=[];
    for(const [i,s] of S){
      const c=CATD[i],p=s.prio;
      if(s.silent&&(p==='O'||p==='X')) continue;
      if(p==='O'){ sug.push({id:i,nombre:c.nombre,motivos:s.motivos}); continue; }
      if(p==='X'){ nor.push({id:i,nombre:c.nombre,motivos:s.motivos}); continue; }
      const fs=c.fases.map(f=>FIDX[f]); const fut=fs.filter(f=>f>=fi);
      let fa,est,ver=false;
      if(fut.length){ fa=Math.min(...fut); est='activo'; }
      else{ fa=Math.max(...fs); ver=(p==='P'||!!c.verificable); est=ver?'activo':'disponible'; }
      const m={id:i,nombre:c.nombre,fase_asignada:T.fases[fa],estado:est,prioridad:p,motivos:s.motivos,tipo:c.tipo,plantilla:c.plantilla,datos_minimos:(i in mins)?mins[i]:c.datos_minimos};
      if(ver) m.verificar_fase_anterior=true;
      if(est==='activo'&&c.requiere_datos) m.estado_datos=(a.datos==='ninguno')?'esperando_datos':'por_cargar';
      mods.push(m);
    }
    if(!mods.some(m=>m.estado==='activo')){
      let prom=mods.filter(m=>m.prioridad==='N'); if(!prom.length) prom=mods;
      for(const m of prom){ m.estado='activo'; m.verificar_fase_anterior=true; if(CATD[m.id].requiere_datos) m.estado_datos=(a.datos==='ninguno')?'esperando_datos':'por_cargar'; }
      adv.push('Tu fase actual es posterior a las herramientas propias de este síntoma; se dejan activas para confirmar que ya se hicieron.');
    }
    const ids=new Set(mods.map(m=>m.id)); const orden=[],vis=new Set();
    function visita(i){
      if(vis.has(i)) return; vis.add(i);
      for(const pr of CATD[i].prereq) for(const x of pr.split('|')) if(ids.has(x)) visita(x);
      if(CATD[i].requiere_datos) for(const x of ['HOJA-DATOS','MUESTREO']) if(ids.has(x)&&x!==i) visita(x);
      orden.push(i);
    }
    const base=mods.slice().sort((x,y)=>(FIDX[x.fase_asignada]-FIDX[y.fase_asignada])||(ORDEN[x.id]-ORDEN[y.id]));
    for(const m of base) visita(m.id);
    const pos={}; orden.forEach((i,n)=>{pos[i]=n;});
    mods.sort((x,y)=>pos[x.id]-pos[y.id]);
    const vmax=T.volumen_max[a.volumen];
    const pend=[];
    for(const m of mods){
      if(m.estado!=='activo') continue;
      const c=CATD[m.id];
      if(c.requiere_datos){
        pend.push({modulo:m.id,minimos:m.datos_minimos});
        if(c.min_n&&vmax!==undefined&&a.datos!=='ninguno'&&vmax<c.min_n){
          const w=`${m.id} necesita al menos ${c.min_n} datos y hoy hay a lo sumo ${vmax<1e8?vmax:'muchos'}.`;
          if(!adv.includes(w)) adv.push(w);
        }
      }
    }
    const act=mods.filter(m=>m.estado==='activo');
    let sig=null;
    for(const m of act){ if(m.prioridad==='N'||m.prioridad==='P'||m.verificar_fase_anterior){ sig=m.id; break; } }
    if(a.datos==='ninguno'&&act.some(m=>m.id==='HOJA-DATOS')) sig='HOJA-DATOS';
    const pe={},dg={},df={};
    T.esquema_salida.perfil_empresa.forEach(k=>{pe[k]=nz(a[k]);});
    T.esquema_salida.diagnostico.forEach(k=>{dg[k]=nz(a[k]);});
    T.cuestionario[T.cuestionario.length-1].campos.forEach(k=>{df[k]=null;});
    return {perfil_empresa:pe,diagnostico:dg,modulos:mods,sugeridos:sug,no_recomendados:nor,hoja_datos_sugerida:[...cols.values()],advertencias:adv,notas:notas,pendientes_datos:pend,ruta_sugerida:act.map(m=>m.id),siguiente_paso:sig,datos_fijos:df,version_perfil:1};
  }
  return {diagnosticar,CATD};
}
if(typeof module!=='undefined') module.exports={crearMotor};
</script>
<script>

const HINTS={

  f_s14_estado:'Si la herramienta puede introducir fallas propias, también hay que medirlas.',
  f_s14_deteccion:'Sirve para saber si los errores se pueden contar de forma confiable.',
  f_s14_familias:'Por ejemplo, la herramienta actúa sobre símbolos, tablas y bloques de título.',
  f_s14_dificultad:'Por ejemplo, un DCN largo cuesta más trabajo que uno corto.',
  datos:'Cuenta lo que ya tengas registrado aunque esté incompleto (por ejemplo, 20 DCN con fechas o tiempos).',

};
const LSK='suite_diagnostico_v1';
let A={},F={nombre_proyecto:'',cliente_area:'',responsable:'',notas:''},baseVersion=0,view='intro',cur=null,edit=false,DL=null,msg='',msgErr=false,resetArm=false,importOpen=false,guiado=false;

/* ---------- utilidades ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function guardar(){try{localStorage.setItem(LSK,JSON.stringify({A,F,baseVersion}));}catch(e){}}

function limpiarLS(){try{localStorage.removeItem(LSK);}catch(e){}}
function colLetra(n){let s='';n++;while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);

/* ---------- secuencia de preguntas ---------- */
function visible(q){
  if(q.sintoma) return A.sintoma===q.sintoma;
  if(q.id==='volumen') return A.datos!=='ninguno';
  if(q.mostrar_si&&q.mostrar_si.sintoma) return q.mostrar_si.sintoma.in.includes(A.sintoma);
  return true;
}
function seq(){
  const L=[];
  for(const e of TREE.cuestionario){
    if(e.campos){L.push({tipo:'fijos',id:'fijos',etapa:e.id});continue;}
    for(const q of e.preguntas) if(visible(q)) L.push(Object.assign({etapa:e.id},q));
  }
  return L;
}
function opcionesDe(q){
  if(q.id==='sintoma') return q.opciones.filter(o=>o[2]===A.categoria);
  if(q.id==='secundarios') return q.opciones.filter(o=>o[0]!==A.sintoma);
  return q.opciones;
}
function limpias(){
  const o={};
  for(const q of seq()){
    if(q.tipo==='fijos') continue;
    if(A[q.id]!==undefined) o[q.id]=A[q.id];
  }
  if(o.secundarios) o.secundarios=o.secundarios.filter(s=>s!==o.sintoma);
  return o;
}
function responder(qid,val){
  A[qid]=val;
  if(qid==='categoria'&&A.sintoma&&SINT[A.sintoma].categoria!==val){delete A.sintoma;limpiarSeg(null);}
  if(qid==='sintoma'){limpiarSeg(val);if(A.secundarios)A.secundarios=A.secundarios.filter(s=>s!==val);}
  if(qid==='datos'&&val==='ninguno') delete A.volumen;
  guardar();
}
function limpiarSeg(s){for(const k of Object.keys(A)) if(k.startsWith('f_')&&QIDX[k]&&QIDX[k].sintoma!==s) delete A[k];}

/* ---------- navegación ---------- */
function ir(id){cur=id;view='q';render();window.scrollTo(0,0);}
function irResultado(){view='result';cur=null;msg='';render();window.scrollTo(0,0);}
function pendiente(){return seq().find(q=>q.tipo!=='fijos'&&q.id!=='secundarios'&&A[q.id]===undefined);}
function siguiente(){
  const L=seq(),i=L.findIndex(q=>q.id===cur);
  if(edit){const f=pendiente();if(f){ir(f.id);return;}edit=false;irResultado();return;}
  if(guiado){const f=L.slice(i+1).find(q=>q.tipo==='fijos'||A[q.id]===undefined);if(f){ir(f.id);return;}irResultado();return;}
  if(i>=0&&i+1<L.length) ir(L[i+1].id); else irResultado();
}
function atras(){
  const L=seq(),i=L.findIndex(q=>q.id===cur);
  guiado=false;
  if(edit){edit=false;irResultado();return;}
  if(i>0) ir(L[i-1].id); else {view='intro';render();}
}
function comenzar(){edit=false;guiado=true;const f=pendiente();ir(f?f.id:'fijos');}

/* ---------- caso JANA ---------- */

  A={tamano:'50-249',n_operadores:2,giro:'ingenieria_documentacion',alcance:'puntual',categoria:'E',sintoma:'S14',secundarios:['S07'],f_s14_dificultad:'si',f_s14_familias:'si',f_s14_estado:'parcial',f_s14_deteccion:'revision',tipo_dato:'mixto',datos:'ninguno',fase_actual:'D',objetivos:['tiempo','errores'],equipo:'2-4',semanas:'4-12'};
  F={nombre_proyecto:'Piloto de calidad JANA INC',cliente_area:'JANA INC — Tech publications',responsable:'',notas:'Área Tech publications con 2 operadores. 20 DCN registrados y 70 por realizar; la longitud de cada DCN define su dificultad. Se compara el trabajo con y sin los códigos LISP.'};
  baseVersion=0;guardar();comenzar();
}

function armarPerfil(){
  const R=MOTOR.diagnosticar(limpias());
  R.datos_fijos={nombre_proyecto:F.nombre_proyecto||null,cliente_area:F.cliente_area||null,responsable:F.responsable||null,logo:null,notas:F.notas||null};
  R.version_perfil=baseVersion+1;
  R.generado_en=new Date().toISOString();
  R.arbol_version=TREE.version;
  R.respuestas=limpias();
  return R;
}
function resumenTexto(P){
  const act=P.modulos.filter(m=>m.estado==='activo').map(m=>`${m.fase_asignada}:${m.id}(${m.prioridad})`).join(', ');
  return `PERFIL DE PROYECTO v${P.version_perfil} (árbol ${P.arbol_version})\nSíntoma: ${SINT[P.diagnostico.sintoma]?SINT[P.diagnostico.sintoma].texto:'—'}\nMódulos activos: ${act}\nSiguiente paso: ${P.siguiente_paso||'—'}\nAvisos: ${P.advertencias.join(' | ')||'—'}\n\nJSON:\n`+JSON.stringify(P,null,2);
}
function csvHoja(P){return '\ufeff'+P.hoja_datos_sugerida.map(c=>c.nombre).join(',')+'\n';}
function nombreArchivo(base,ext,P){const s=slug(F.nombre_proyecto);return (s?s+'_':'')+base+(P?'_v'+P.version_perfil:'')+'.'+ext;}
async function descargar(tipo){
  const P=armarPerfil();
  if(!DL){setMsg('La descarga no está disponible aquí; usa Copiar.',true);return;}
  try{
    if(tipo==='json') await DL.save({filename:nombreArchivo('perfil_proyecto','json',P),data:JSON.stringify(P,null,2)});
    else await DL.save({filename:nombreArchivo('hoja_datos_plantilla','csv',null),data:csvHoja(P)});
    setMsg('Archivo entregado.',false);
  }catch(e){setMsg(e&&e.code==='declined'?'Descarga cancelada.':'No se pudo descargar aquí; usa Copiar.',true);}
}
async function copiar(){
  const t=resumenTexto(armarPerfil());

  setMsg('Selecciona el texto del recuadro y cópialo.',true);
}
function setMsg(t,err){msg=t;msgErr=!!err;const s=document.getElementById('status');if(s){s.textContent=t;s.className='status'+(err?' err':'');}}
function importar(){
  const ta=document.getElementById('imp');let o;

    <p class="muted small">Todo ocurre en tu navegador. Puedes volver atrás y cambiar cualquier respuesta sin perder el resto.</p>

function vistaPregunta(){
  const L=seq();let i=L.findIndex(q=>q.id===cur);
  if(i<0){const f=pendiente();return f?(cur=f.id,vistaPregunta()):(view='result',vistaResultado());}

  }
  if(q.tipo==='numero'){
    const v=A[q.id]===undefined?'':A[q.id];
    return `<div class="card">${head}<input id="num" type="number" min="${q.min||1}" step="1" inputmode="numeric" value="${esc(v)}" style="max-width:160px" aria-label="${esc(q.texto)}"><div class="nav">${back}<button class="btn" type="button" data-act="numok">Continuar</button></div></div>`;
  }
  return '';
}
function etiquetaResp(q){
  const v=A[q.id];if(v===undefined) return '—';
  if(q.tipo==='numero') return String(v);
  const nm=x=>{const o=(q.opciones||[]).find(o=>o[0]===x);return o?o[1]:x;};
  if(q.tipo==='multiple') return v.length?v.map(nm).join('; '):'ninguno';

function celdasHoja(P){
  const cols=P.hoja_datos_sugerida;if(!cols.length) return '<p class="muted small">Este síntoma no propone columnas específicas; define las tuyas en el programa.</p>';
  const filas=[1,2,3,4,5,6].map(n=>`<tr><th class="rn">${n}</th>${cols.map(()=>'<td>&nbsp;</td>').join('')}</tr>`).join('');
  return `<div class="scroll"><table class="xl"><thead>
    <tr class="l"><th class="rn"></th>${cols.map((c,i)=>`<th>${colLetra(i)}</th>`).join('')}</tr>
    <tr><th class="rn"></th>${cols.map(c=>`<th title="${esc(c.desc)}">${esc(c.nombre)}</th>`).join('')}</tr>
    <tr class="r"><th class="rn"></th>${cols.map(c=>`<th>${esc(c.rol)}</th>`).join('')}</tr>
    </thead><tbody>${filas}</tbody></table></div>
    <details><summary>Qué significa cada columna</summary><div>${cols.map(c=>`<div><b>${esc(c.nombre)}</b> (${esc(c.rol)})${c.desc?': '+esc(c.desc):''}</div>`).join('')}</div></details>`;
}
function filaMod(m){
  const badges=[`<span class="badge ${m.prioridad}">${PRIO[m.prioridad]}</span>`,`<span class="badge">${TIPO[m.tipo]||m.tipo}</span>`];
  if(m.estado_datos==='esperando_datos') badges.push('<span class="badge w">esperando datos</span>');
  else if(m.estado_datos==='por_cargar') badges.push('<span class="badge">por cargar datos</span>');
  if(m.verificar_fase_anterior) badges.push('<span class="badge w">verificar fase anterior</span>');

      <div class="row"><button class="btn" type="button" data-act2="retomar">Retomar la sesión</button></div></div>
    <div><h2>Empezar sin folio</h2><p class="muted small">Se crea una sesión nueva con su folio. Lo recibirás en el TXT de instrucciones.</p>
      <div class="row"><button class="btn ghost" type="button" data-act2="nueva">Empezar una sesión nueva</button></div></div></div>
    <div class="status" id="msg2" role="status"></div><p class="muted small">Cada sesión se guarda cifrada con su folio: sin el folio nadie puede abrirla.</p></div>`;
}
function vistaDatos() {
  const campo = (k, t, largo) => `<label for="f_${k}">${t}</label>${largo ? `<textarea id="f_${k}" data-f2="${k}" rows="4">${esc(F[k] || "")}</textarea>` : `<input id="f_${k}" data-f2="${k}" value="${esc(F[k] || "")}">`}`;
  return `<div class="card"><div class="eyebrow">Datos fijos del proyecto</div><h1>Datos del proyecto</h1><p class="muted small">Pasan al encabezado de todos los formatos de D-MIKE.</p>
    ${campo("nombre_proyecto", "Nombre del proyecto")}${campo("cliente_area", "Cliente o área")}${campo("responsable", "Responsable")}${campo("notas", "Notas (sin información confidencial)", true)}</div>`;
}
function vistaAsistente() {
  if (!PUEDE_CHAT) return `<div class="card"><h1>Asistente</h1><p class="muted">El asistente solo está disponible para el dueño de este diagnóstico y para quien él autorice como editor.</p></div>`;
  if (!SAMPLE) return `<div class="card"><h1>Asistente</h1><p class="muted">El asistente no está disponible en esta vista. El resto del diagnóstico funciona igual.</p></div>`;
  const inicio = '<div class="msg assistant">Descríbeme qué deseas mejorar: qué se mide hoy, cuánto da y a dónde quieres llegar.</div>';
  return `<div class="card chat"><div class="eyebrow">Sesión ${esc(FOLIO || "")} · usa tu cuota de Claude</div><h1>Asistente</h1>
    <div id="chatlog" class="chatlog">${inicio}${CHAT.map(m => `<div class="msg ${m.role}">${esc(m.content).replace(/\n/g, "<br>")}</div>`).join("")}</div>
    <div class="row"><textarea id="pregunta" rows="2" placeholder="Escribe y presiona Enter" ${PENSANDO ? "disabled" : ""}></textarea>
    <button class="btn" type="button" data-act2="enviar" ${PENSANDO ? "disabled" : ""}>${PENSANDO ? "Pensando…" : "Enviar"}</button></div>
    <div class="row"><button class="btn sm" type="button" data-act2="receta" ${PENSANDO || !CHAT.length ? "disabled" : ""}>Preparar la receta</button><button class="btn ghost sm" type="button" data-act2="borrarchat">Borrar conversación</button></div>
    <div class="status" id="msg2" role="status"></div></div>`;
}
function pintaChat() { const c = document.getElementById("chatlog"); if (!c) return; const u = c.lastElementChild; const m = CHAT[CHAT.length - 1]; if (u && m) u.innerHTML = esc(m.content).replace(/\n/g, "<br>"); c.scrollTop = c.scrollHeight; }
function vistaReunir() {
  const R = armarReceta();
  const tablas = R.hojas.map(h => `<h2>${esc(h.titulo || h.hoja)} <span class="id">${esc(h.hoja)}</span></h2>
    <div class="tabla"><table><thead><tr><th>Columna</th><th>Tipo</th><th>Unidad</th><th>Para qué sirve</th></tr></thead><tbody>${h.columnas.map(c => `<tr><td><b>${esc(c.nombre)}</b></td><td>${esc(c.tipo)}</td><td>${esc(c.unidad)}</td><td>${esc(c.descripcion)}</td></tr>`).join("")}</tbody></table></div>`).join("");
  return `<div class="card"><div class="eyebrow">${R.origen ? esc(R.origen) : "Diagnóstico en línea"}</div><h1>Datos a reunir</h1>
    <p class="muted">Las categorías que llenas tú en la plantilla. El artefacto no captura mediciones.</p>${tablas}</div>`;
}
function vistaExportar() {
  const R = armarReceta();
  return `<div class="card"><div class="eyebrow">Receta v${R.receta_version} · folio ${esc(R.folio || "—")} · requiere D-MIKE ${esc(R.dmike_minimo)}</div><h1>Llevar a D-MIKE</h1>
    <div class="resumen"><span><b>${R.hojas.length}</b> hojas</span><span><b>${R.disenos.length}</b> diseños</span><span><b>${R.formatos.length}</b> formatos</span><span><b>${R.analisis.length}</b> análisis</span></div>
    <div class="row"><button class="btn" type="button" data-act2="xlsx">Descargar plantilla .xlsx</button><button class="btn" type="button" data-act2="txt">Descargar instrucciones .txt</button><button class="btn ghost" type="button" data-act2="json">Receta (.json)</button></div>
    <ol class="pasos"><li>Llena la plantilla (instrucciones en el TXT).</li><li>En D-MIKE: <b>Archivo › Abrir proyecto</b> y elige la plantilla.</li><li>Elige ejecutar en un proyecto nuevo, actualizar el proyecto con este folio o solo abrir los datos.</li></ol>
    <div class="row"><button class="btn ghost sm" type="button" data-act2="maestro">Cargar el caso maestro (uniones adhesivas)</button><button class="btn ghost sm" type="button" data-act2="impreceta">Importar una receta</button>${R_IMPORT || R_PARCIAL ? '<button class="btn ghost sm" type="button" data-act2="quitarreceta">Volver a la receta del diagnóstico</button>' : ""}</div>
    <div id="impbox" hidden><label for="imprec">Pega aquí el JSON de una receta</label><textarea id="imprec" class="json"></textarea><div class="row"><button class="btn sm" type="button" data-act2="impok">Importar</button></div></div>
    <div class="status" id="msg2" role="status"></div></div>`;
}
function pintar() {
  const sesion = !!FOLIO;
  $nav.hidden = !sesion;
  $nav.innerHTML = SECC.map(([id, t, d]) => `<button type="button" class="nav-b${id === SEC ? " activo" : ""}" data-sec="${id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>${t}${id === "asistente" && !PUEDE_CHAT ? ' <span class="cand">privado</span>' : ""}</button>`).join("");
  document.getElementById("app").hidden = !sesion || SEC !== "diag";
  const p = document.getElementById("otra"); p.hidden = sesion && SEC === "diag";
  if (!sesion) p.innerHTML = vistaInicio();
  else if (SEC === "diag") render();
  else p.innerHTML = SEC === "datos" ? vistaDatos() : SEC === "asistente" ? vistaAsistente() : SEC === "reunir" ? vistaReunir() : vistaExportar();
  const c = document.getElementById("chatlog"); if (c) c.scrollTop = c.scrollHeight;
}
$nav.addEventListener("click", ev => { const b = ev.target.closest("[data-sec]"); if (!b) return; SEC = b.dataset.sec; pintar(); window.scrollTo(0, 0); });
document.getElementById("otra").addEventListener("input", ev => { const k = ev.target.dataset.f2; if (k) { F[k] = ev.target.value; persistir(); } });
document.getElementById("otra").addEventListener("keydown", ev => { if (ev.target.id === "pregunta" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); preguntar(ev.target.value); } if (ev.target.id === "folio-in" && ev.key === "Enter") document.querySelector("[data-act2='retomar']").click(); });
document.getElementById("otra").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act2]"); if (!b) return; const a = b.dataset.act2;
  if (a === "retomar") { try { await abrirSesion(document.getElementById("folio-in").value, false); } catch (e) { aviso(e.message === "folio" ? "Ese folio no tiene el formato DMK-XXXX-XXXX-XXXX." : e.message === "no_existe" ? "No hay ninguna sesión con ese folio." : "No se pudo abrir la sesión con ese folio.", true); FOLIO = null; } }
  else if (a === "nueva") { await abrirSesion(nuevoFolio(), true); }
  else if (a === "enviar") preguntar(document.getElementById("pregunta").value);
  else if (a === "receta") prepararReceta();
  else if (a === "borrarchat") { CHAT = []; persistir(); pintar(); }
  else if (a === "xlsx") plantillaXLSX();
  else if (a === "txt") bajar(nombreArchivo("instrucciones", "txt", null), textoInstrucciones());
  else if (a === "json") bajar(nombreArchivo("receta", "json", null), JSON.stringify(armarReceta(), null, 1));
  else if (a === "maestro") { R_IMPORT = JSON.parse(JSON.stringify(RECETA_MAESTRA)); Object.assign(F, R_IMPORT.datos_fijos); persistir(); pintar(); aviso("Caso maestro cargado."); }
  else if (a === "quitarreceta") { R_IMPORT = null; R_PARCIAL = null; persistir(); pintar(); }
  else if (a === "impreceta") { const x = document.getElementById("impbox"); x.hidden = !x.hidden; }
  else if (a === "impok") { try { const o = JSON.parse(document.getElementById("imprec").value); if (o.tipo !== "dmike-receta") throw 0; R_IMPORT = o; Object.assign(F, o.datos_fijos || {}); persistir(); pintar(); aviso("Receta importada."); } catch (e) { aviso("Ese texto no es una receta de D-MIKE.", true); } }
});
/* ---------- tema ---------- */
const $tema = document.getElementById("tema");
function aplicaTema(o) { document.documentElement.dataset.theme = o ? "dark" : "light"; $tema.checked = o; try { localStorage.setItem("dmike_diag_tema", o ? "dark" : "light"); } catch (e) { } }
let temaG = null; try { temaG = localStorage.getItem("dmike_diag_tema"); } catch (e) { }
aplicaTema(temaG ? temaG === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
$tema.addEventListener("change", () => aplicaTema($tema.checked));
/* ---------- arranque ---------- */
pintar(); GUARDADO = ""; pintaEstado();
(async () => {
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, user, sample, dl] = await Promise.all([use("db"), use("user"), use("sample"), use("downloads")]);
  DL = dl || null; SAMPLE = sample || null; DB = db || null;
  if (user) { try { PUEDE_CHAT = (await user.isOwner()) || (await user.canEdit()); } catch (e) { } }
  pintar();
})();

</script>
</body>
</html>
